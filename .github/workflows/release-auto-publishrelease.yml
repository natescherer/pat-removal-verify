name: "Release (Auto): Publish Release"

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release-on-knope-pr-merge:
    if: github.head_ref == 'knope/release' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: Publish Release
        shell: bash
        run: mise x -- knope release-on-knope-pr-merge --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger Docs Latest-Alias Deploy
        shell: bash
        # A release created with the default GITHUB_TOKEN doesn't fire a `release:
        # published` event that docs-auto-zensical.yml's own `release:` trigger could
        # react to (GitHub doesn't cascade-trigger workflow runs from GITHUB_TOKEN-
        # authenticated actions, to prevent recursion; see
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow).
        # workflow_dispatch is a documented exception to that rule, so dispatching it
        # directly here reaches the same result without needing a PAT.
        # Reads the tag via the API rather than local git: Knope creates the release
        # through the GitHub API, so the job's own checkout never locally fetches the
        # new tag ref.
        run: gh workflow run docs-auto-zensical.yml -f tag="$(gh release view --json tagName -q .tagName)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
